[project]
name = "backend"
version = "0.0.1"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
# B008/B010: Depends() / File() in argument defaults is the standard FastAPI
# dependency-injection pattern; ruff can't auto-fix it and it's idiomatic here.
ignore = ["B008", "B010"]

[tool.ruff.lint.isort]
known-first-party = ["config", "database", "deps", "main", "routes", "schemas", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"