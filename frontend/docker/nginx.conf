server {
    listen 8080;
    server_name _;

    # --- /api -> FastAPI backend (the "trivia fallback") ------------------
    # The frontend forwards API calls itself, so requests still reach the
    # backend even if the Cloudflare tunnel's /api path rule doesn't match.
    #
    # Target is the Compose service DNS name on its CONTAINER port:
    #   backend:3000   (NOT localhost:3000 — that's this container;
    #                   NOT :3011 — that's the host-side port mapping)
    #
    # $request_uri forwards the full original path (/api/names -> /api/names),
    # which is what the FastAPI router expects. Resolution happens per-request
    # via Docker's embedded DNS, so nginx starts even if the backend isn't up
    # yet and picks up IP changes without a reload.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
         # Bulk manuscript uploads: nginx's default limit is 1 MB.
        client_max_body_size 2048m;
        proxy_request_buffering off;   # stream uploads straight to the backend
        proxy_read_timeout 600s;       # PDF rendering can take a while
        proxy_send_timeout 600s;
        set $backend_host "backend:3000";
        proxy_pass http://$backend_host$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static SPA --------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}