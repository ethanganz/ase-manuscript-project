name: Build and Push to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Emulates non-native arches so we can build linux/arm64 (Raspberry Pi)
      # on the amd64-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image: FastAPI + uvicorn (host port 3011 in docker-compose.yml).
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/ase-manuscript-project-backend:latest
            ghcr.io/${{ github.repository_owner }}/ase-manuscript-project-backend:${{ github.sha }}

      # Frontend image: static SPA served by nginx (host port 8011).
      # VITE_API_BASE defaults to /api; pass a build-arg if your Cloudflare setup
      # exposes the API on a separate hostname.
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/ase-manuscript-project-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ase-manuscript-project-frontend:${{ github.sha }}
