services:
  backend:
    # Built & pushed to GHCR by .github/workflows/docker-build.yml on push to main,
    # tagged with the version in backend/docker/IMAGE_VERSION as well as :latest.
    # `deploy.sh` selects the pinned version (falls back to :latest); `build:` is
    # used for local dev.
    # `docker compose pull` fetches the selected tag on the server.
    image: ghcr.io/ethanganz/ase-manuscript-project-backend:${BACKEND_IMAGE_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "3011:3000"

    env_file:
      - ./backend/.env
    restart: unless-stopped

  htr-models:
    # One-time model download (about 3 GB) into the Docker volume "htr-models".
    # The volume survives `docker compose down` and restarts, so this only
    # downloads again if you delete it (`docker compose down -v`). On later runs
    # it finds the models and exits in a second.
    profiles: ["htr"]
    image: ase-manuscript-htr:local
    build:
      context: ./HTR-NLP
      dockerfile: docker/Dockerfile
    user: root
    command: ["python", "scripts/install_models.py"]
    volumes:
      - htr-models:/app/models
    restart: "no"

  htr:
    # Handwriting recognition for uploaded pages. Start everything with:
    #   docker compose --profile htr up --build
    # and set HTR_SERVICE_URL=http://htr:8000 in backend/.env.
    # Not published to the host: only the backend talks to it.
    profiles: ["htr"]
    image: ase-manuscript-htr:local
    depends_on:
      htr-models:
        condition: service_completed_successfully
    volumes:
      - htr-models:/app/models:ro
    environment:
      HTR_DEVICE: cpu
    healthcheck:
      # Healthy once the models are loaded (can take a minute).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped
    ports:
      - "8000:8000"

  ollama:
    # Free local language model for the page chat (instead of Gemini). Start with:
    #   docker compose --profile ollama up --build
    # and set in backend/.env:  LLM_PROVIDER=ollama   OLLAMA_URL=http://ollama:11434
    # Not published to the host: only the backend talks to it. To move it to another
    # machine, run this service there and point OLLAMA_URL at that machine.
    # With an NVIDIA GPU (and the NVIDIA container toolkit) uncomment "deploy" below.
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-models:
    # One-time model download into the volume "ollama-models" (llama3.2:3b is about
    # 2 GB). Change the model with OLLAMA_MODEL in the .env next to this file, and use
    # the same name in backend/.env. Later runs find the model and exit quickly.
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  frontend:
    # Tag comes from frontend/docker/IMAGE_VERSION via deploy.sh (defaults to :latest).
    image: ghcr.io/ethanganz/ase-manuscript-project-frontend:${FRONTEND_IMAGE_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "8011:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  htr-models:
  ollama-models:
