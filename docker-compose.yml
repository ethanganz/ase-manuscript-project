services:
  backend:
    # Built & pushed to GHCR by .github/workflows/docker-build.yml on push to main,
    # tagged with the version in backend/docker/IMAGE_VERSION as well as :latest.
    # `deploy.sh` selects the pinned version (falls back to :latest); `build:` is
    # used for local dev.
    # `docker compose pull` fetches the selected tag on the server.
    image: ghcr.io/ethanganz/ase-manuscript-project-backend:${BACKEND_IMAGE_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "3011:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  htr:
    # Handwriting recognition for uploaded pages. Opt-in, because it needs the
    # models downloaded into htr/models and htr/.cache first (htr/README.md):
    #   docker compose --profile htr up -d
    # and HTR_SERVICE_URL=http://htr:8000 in backend/.env. Not published to the
    # host: only the backend talks to it.
    profiles: ["htr"]
    build:
      context: ./htr
      dockerfile: docker/Dockerfile
    volumes:
      - ./htr/models:/app/models:ro
      - ./htr/.cache:/app/.cache:ro
    environment:
      HTR_DEVICE: cpu
    restart: unless-stopped

  frontend:
    # Tag comes from frontend/docker/IMAGE_VERSION via deploy.sh (defaults to :latest).
    image: ghcr.io/ethanganz/ase-manuscript-project-frontend:${FRONTEND_IMAGE_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "8011:8080"
    depends_on:
      - backend
    restart: unless-stopped
